<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="VitaSênior v0.3.0 — Treino fisioterapêutico personalizado para idosos. Alongamento, equilíbrio e respiração de forma simples e segura.">
  <title>VitaSênior v0.3.0 — Movimento é vida</title>

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <!-- Estilos -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ==========================================
       TELA 1: BEM-VINDO / SELEÇÃO DE PERFIL
       ========================================== -->
  <div id="screen-welcome" class="screen active">
    <div class="q-container">
      <div class="logo-area" style="text-align:center">
        <span class="logo-icon">🌿</span>
        <h1>VitaSênior</h1>
        <p class="slogan">Movimento é vida</p>
        <p class="version-tag">v0.3.0</p>
      </div>

      <div class="q-step">
        <h2>👤 Quem vai usar o app?</h2>
        <div class="q-options" id="role-opts">
          <div class="q-opt" onclick="selecionarPerfil(this,'self')">
            <span class="q-check"></span>Eu sou o praticante
          </div>
          <div class="q-opt" onclick="selecionarPerfil(this,'instructor')">
            <span class="q-check"></span>Estou orientando um(a) idoso(a)
          </div>
        </div>
      </div>

      <button class="btn-next" onclick="iniciarQuestionario()" id="btn-start">
        Começar avaliação →
      </button>
    </div>
  </div>

  <!-- ==========================================
       TELA 2: QUESTIONÁRIO DE SAÚDE
       ========================================== -->
  <div id="screen-quiz" class="screen">
    <div class="header">
      <button class="btn-back" onclick="mostrarTela('welcome')" aria-label="Voltar">←</button>
      <h2>Avaliação de Saúde</h2>
    </div>
    <div class="q-container" style="min-height:auto;padding-top:16px">
      <div class="progress-bar">
        <div class="progress-fill" id="prog-fill" style="width:0%"></div>
      </div>
      <div id="quiz-content"></div>
    </div>
  </div>

  <!-- ==========================================
       TELA 3: TREINO PERSONALIZADO
       ========================================== -->
  <div id="screen-plan" class="screen">
    <div class="header">
      <button class="btn-back" onclick="mostrarTela('welcome')" aria-label="Voltar">←</button>
      <h2>Seu Treino Personalizado</h2>
    </div>
    <div class="list-container" id="plan-content"></div>
  </div>

  <!-- ==========================================
       TELA 4: HOME — CATEGORIAS
       ========================================== -->
  <div id="screen-home" class="screen">
    <div class="home-container">
      <div class="logo-area">
        <span class="logo-icon">🌿</span>
        <h1>VitaSênior</h1>
        <p class="slogan">Movimento é vida</p>
      </div>

      <div class="categories">
        <button class="cat-btn" onclick="abrirCategoria('alongamento')" id="btn-cat-along">
          <span class="emoji">🧘</span>
          <span class="label">Alongamento<small>Flexibilidade e conforto</small></span>
        </button>
        <button class="cat-btn" onclick="abrirCategoria('equilibrio')" id="btn-cat-equil">
          <span class="emoji">⚖️</span>
          <span class="label">Equilíbrio<small>Segurança e estabilidade</small></span>
        </button>
        <button class="cat-btn" onclick="abrirCategoria('respiracao')" id="btn-cat-resp">
          <span class="emoji">🌬️</span>
          <span class="label">Respiração<small>Calma e bem-estar</small></span>
        </button>
      </div>

      <button class="cat-btn" onclick="mostrarTela('plan')" style="max-width:400px;margin-top:24px;border:2px solid var(--verde)" id="btn-my-plan">
        <span class="emoji">📋</span>
        <span class="label">Meu Treino Personalizado<small>Baseado na sua avaliação</small></span>
      </button>

      <div class="footer-home">
        Projeto universitário — <span>Impacto Social</span>
      </div>
    </div>
  </div>

  <!-- ==========================================
       TELA 5: LISTA DE EXERCÍCIOS (por categoria)
       ========================================== -->
  <div id="screen-list" class="screen">
    <div class="header">
      <button class="btn-back" onclick="mostrarTela('home')" aria-label="Voltar">←</button>
      <h2 id="list-title">Categoria</h2>
    </div>
    <div class="list-container">
      <div class="filter-bar" id="filter-bar">
        <button class="filter-btn active" onclick="filtrarDificuldade('todos',this)">Todos</button>
        <button class="filter-btn" onclick="filtrarDificuldade('fácil',this)">Fácil</button>
        <button class="filter-btn" onclick="filtrarDificuldade('médio',this)">Médio</button>
      </div>
      <div class="cards-grid" id="cards-grid"></div>
    </div>
  </div>

  <!-- ==========================================
       TELA 6: DETALHE DO EXERCÍCIO
       ========================================== -->
  <div id="screen-detail" class="screen">
    <div class="header">
      <button class="btn-back" onclick="voltarParaLista()" aria-label="Voltar">←</button>
      <h2 id="detail-header-title">Exercício</h2>
    </div>
    <div class="detail-container" id="detail-content"></div>
  </div>

  <!-- Notificação toast -->
  <div class="toast" id="toast">✅ Parabéns! Exercício concluído!</div>

  <!-- Scripts -->
  <script src="js/exercises.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
